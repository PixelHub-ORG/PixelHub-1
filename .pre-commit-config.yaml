repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
        pass_filenames: true  # solo archivos staged

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # Rosemary linter (hook local)
  - repo: local
    hooks:
      - id: rosemary
        name: Rosemary linter
        entry: rosemary
        language: system
        types: [python]
        args: ["linter"]
        pass_filenames: false  # revisa la carpeta completa, no archivos individuales

  # Black
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        pass_filenames: true  # solo archivos staged

  # isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        pass_filenames: true  # solo archivos staged
