name: SonarQube Analysis
on:
  push:
    branches:
      - trunk # Rama principal
      - "**" # TEMPORAL: Para probar en cualquier rama (eliminar después)
  pull_request:
    branches:
      - trunk

jobs:
  testing:
    name: Run Tests and SonarQube Analysis
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: pixelhub_root_password
          MYSQL_DATABASE: pixelhubdb_test
          MYSQL_USER: pixelhub_user
          MYSQL_PASSWORD: pixelhub_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Importante para SonarQube: trae todo el historial

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests with Coverage
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: pixelhubdb_test
          MARIADB_USER: pixelhub_user
          MARIADB_PASSWORD: pixelhub_password
        run: |
          pytest --cov=app/modules --cov-report=xml --cov-report=term --ignore-glob='*selenium*'

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
